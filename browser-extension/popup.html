<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeToFrame Extractor</title>
  <style>
    /* Reset & Typography */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #2c2c2c;
      color: #e6e6e6;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #444444;
      padding-bottom: 10px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .badge {
      font-size: 10px;
      background-color: #18a0fb;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* Description */
    p.desc {
      font-size: 12px;
      color: #b3b3b3;
      line-height: 1.4;
    }

    /* Buttons */
    button {
      width: 100%;
      padding: 12px;
      background-color: #18a0fb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
      outline: none;
    }

    button:hover:not(:disabled) {
      background-color: #0d8de3;
    }

    button:active:not(:disabled) {
      background-color: #0a7ccb;
    }

    button:disabled {
      background-color: #444444;
      color: #888888;
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* Status & Message */
    .status-container {
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #status-message {
      font-size: 12px;
      text-align: center;
      line-height: 1.4;
      font-weight: 500;
      transition: color 0.2s;
    }

    .status-success {
      color: #0cd15b;
    }

    .status-error {
      color: #ff3b30;
    }

    .status-info {
      color: #18a0fb;
    }

    /* Footer info */
    footer {
      font-size: 10px;
      color: #777777;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>CodeToFrame</h1>
    <span class="badge">MVP v1.0</span>
  </header>

  <main>
    <p class="desc">Ekstrak struktur elemen visual dan teks dari halaman web aktif ini ke dalam format JSON yang siap digambar di Figma.</p>
  </main>

  <div class="action-container">
    <button id="extract-btn" aria-label="Ekstrak DOM dan salin ke Clipboard">
      Extract & Copy DOM
    </button>
  </div>

  <div class="status-container">
    <span id="status-message">Ready to extract</span>
  </div>

  <footer>
    Hubungkan desain & kode secara instan.
  </footer>

  <!-- popup.ts akan di-compile menjadi popup.js oleh bundler/Vite -->
  <script type="module" src="src/popup.ts"></script>
</body>
</html>
